{% macro auth_card(title, icon=None, description=None) %}
<div class="container tf-auth-page py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card tf-form-card shadow-sm">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <div class="tf-auth-heading">
                            <h1 class="h3 tf-section-title mb-0">{{ title }}</h1>
                            {% if icon %}
                            <img class="tf-auth-icon" src="{{ icon }}" alt="{{ title }}">
                            {% endif %}
                        </div>
                        {% if description %}
                        <p class="text-muted mb-0">{{ description }}</p>
                        {% endif %}
                    </div>
                    {{ caller() }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
